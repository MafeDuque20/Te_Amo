
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti | Nuestro reproductor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#090d12;
  --panel:#121b22;
  --panel2:#18252d;
  --text:#eef5f3;
  --muted:#92aaa7;
  --green:#70d8b1;
  --blue:#80aaff;
  --pink:#f4a3c2;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at 10% 0%,#143d36 0%,transparent 42%),
             radial-gradient(ellipse at 100% 10%,#162640 0%,transparent 40%),
             var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1060px;margin:auto;padding:32px 20px 70px}
header{text-align:center;margin-bottom:35px}
h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(28px,5vw,46px);
  font-weight:500;
  margin:8px 0;
}
header p{color:var(--muted);font-size:14px}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:24px;
  align-items:start;
}
.panel{
  background:rgba(18,27,34,.84);
  border:1px solid var(--line);
  border-radius:24px;
  padding:25px;
  box-shadow:0 18px 60px rgba(0,0,0,.22);
}
.player{text-align:center}
.vinyl-wrap{
  width:min(270px,75%);
  aspect-ratio:1;
  margin:10px auto 25px;
  position:relative;
}
.vinyl{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    repeating-radial-gradient(circle,transparent 0 5px,rgba(255,255,255,.045) 6px 7px),
    conic-gradient(#070a0c,#222b30,#060809,#25353b,#070a0c);
  box-shadow:0 15px 45px #0009,0 0 0 1px #ffffff22;
  animation:rotate 9s linear infinite;
  animation-play-state:paused;
}
.vinyl.playing{animation-play-state:running}
.vinyl-center{
  position:absolute;
  inset:33%;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#8de4be,#286b66 60%,#243e62);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 0 2px #ffffff28;
}
.vinyl-center span{
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-size:12px;
  color:white;
}
.vinyl-center:after{
  content:"";
  width:8px;
  height:8px;
  background:#071016;
  border-radius:50%;
  position:absolute;
}
@keyframes rotate{to{transform:rotate(360deg)}}
.now-label{
  color:var(--green);
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:10px;
  font-weight:700;
}
#songTitle{
  font-family:"Playfair Display",serif;
  font-size:29px;
  font-weight:500;
  margin:12px 0 7px;
}
#trackNumber{color:var(--muted);font-size:12px}
.progress{
  margin:27px 0 13px;
}
input[type=range]{
  width:100%;
  accent-color:var(--green);
  cursor:pointer;
}
.time{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  margin-top:8px;
}
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
  margin:21px 0;
}
.control{
  border:0;
  color:#d4e6e2;
  background:transparent;
  font-size:23px;
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
}
.control:hover{background:#ffffff13}
.control.active{color:var(--green)}
.main-play{
  width:64px;
  height:64px;
  color:#09241c;
  background:linear-gradient(135deg,#92e9c1,#6fa9ed);
  border-radius:50%;
  font-size:26px;
  border:0;
  box-shadow:0 8px 28px #70d8b133;
}
.main-play:hover{transform:scale(1.06)}
.volume{
  display:flex;
  align-items:center;
  gap:15px;
  justify-content:center;
  max-width:240px;
  margin:25px auto 0;
  color:var(--muted);
}
.volume input{max-width:170px}
.playlist-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.playlist-head h2{
  font-size:18px;
  font-weight:600;
  margin:0;
}
.count{color:var(--muted);font-size:12px}
.track{
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  background:transparent;
  border:1px solid transparent;
  text-align:left;
  padding:13px;
  color:var(--text);
  border-radius:14px;
  margin-bottom:8px;
  transition:.2s;
}
.track:hover{background:#ffffff0b}
.track.selected{
  background:linear-gradient(110deg,#21473c88,#1c304c77);
  border-color:#70d8b13b;
}
.track-num{
  color:var(--green);
  font-size:13px;
  width:24px;
}
.track-info{flex:1;min-width:0}
.track-name{
  display:block;
  font-size:14px;
  font-weight:600;
}
.track-sub{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}
.track-icon{
  color:var(--green);
  font-size:17px;
}
.dedication{
  background:linear-gradient(135deg,#1a3733,#24243d);
  border:1px solid #90b4b42e;
  border-radius:13px;
  padding:14px 16px;
  margin:2px 5px 13px 40px;
  color:#f0dce7;
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-size:15px;
  line-height:1.6;
}
.dedication small{
  display:block;
  margin-bottom:5px;
  color:var(--green);
  font:600 10px Inter,sans-serif;
}
.notice{
  color:var(--pink);
  font-size:12px;
  line-height:1.6;
  margin-top:15px;
}
.notice:empty{display:none}
@media(max-width:750px){
  .layout{grid-template-columns:1fr}
  .panel{padding:22px 18px}
  .app{padding:25px 13px 55px}
  .vinyl-wrap{width:min(240px,72%)}
}
@media(prefers-reduced-motion:reduce){
  .vinyl{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Canciones que me hacen pensar en ti</h1>
    <p>Aquí voy a guardar las canciones que me recuerdan a ti.</p>
  </header>

  <div class="layout">
    <section class="panel player">
      <div class="vinyl-wrap">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-center"><span>Para ti</span></div>
        </div>
      </div>

      <div class="now-label">Reproduciendo ahora</div>
      <h2 id="songTitle">Beso</h2>
      <div id="trackNumber">Canción 01 de 07</div>

      <div class="progress">
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Progreso">
        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="control" id="shuffle" title="Aleatorio">⤨</button>
        <button class="control" id="previous" title="Anterior">⏮</button>
        <button class="main-play" id="play" title="Reproducir">▶</button>
        <button class="control" id="next" title="Siguiente">⏭</button>
        <button class="control" id="repeat" title="Repetir">↻</button>
      </div>

      <div class="volume">
        <span>♫</span>
        <input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volumen">
      </div>
      <p class="notice" id="notice"></p>
    </section>

    <section class="panel">
      <div class="playlist-head">
        <h2>Nuestras canciones</h2>
        <span class="count">7 canciones</span>
      </div>
      <div id="playlist"></div>
    </section>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const songs = [
  {
    title:"Beso",
    file:"audio/cancion-01.mp3"
  },
  {
    title:"Donde Nadie Pueda Ir",
    file:"audio/cancion-02.mp3"
  },
  {
    title:"Feliz me Siento",
    file:"audio/cancion-03.mp3",
    date:"19/08/2026",
    message:"Feliz primer año de muchos amor mío ❤️"
  },
  {
    title:"Eres ese Algo",
    file:"audio/cancion-04.mp3",
    date:"19/08/2026",
    message:"El día en que nuestras vidas se cruzaron para siempre ❤️"
  },
  {
    title:"UWAIE",
    file:"audio/cancion-05.mp3"
  },
  {
    title:"DÓNDE",
    file:"audio/cancion-06.mp3",
    message:"Esta siempre me recordaba a ti desde que salió. ❤️"
  },
  {
    title:"Que Tienen Tus Ojos",
    file:"audio/cancion-07.mp3"
  }
];

const audio = document.getElementById("audio");
const vinyl = document.getElementById("vinyl");
const songTitle = document.getElementById("songTitle");
const trackNumber = document.getElementById("trackNumber");
const playlist = document.getElementById("playlist");
const playButton = document.getElementById("play");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const volume = document.getElementById("volume");
const notice = document.getElementById("notice");
const shuffleButton = document.getElementById("shuffle");
const repeatButton = document.getElementById("repeat");

let current = 0;
let shuffle = false;
let repeat = false;

function number(n) {
  return String(n).padStart(2,"0");
}

function formatTime(time) {
  if (!Number.isFinite(time)) return "0:00";
  const minutes = Math.floor(time / 60);
  const seconds = Math.floor(time % 60);
  return minutes + ":" + number(seconds);
}

function renderPlaylist() {
  playlist.innerHTML = "";

  songs.forEach((song,index) => {
    const container = document.createElement("div");
    const button = document.createElement("button");
    button.className = "track" + (index === current ? " selected" : "");
    button.type = "button";

    const num = document.createElement("span");
    num.className = "track-num";
    num.textContent = number(index + 1);

    const info = document.createElement("span");
    info.className = "track-info";

    const name = document.createElement("span");
    name.className = "track-name";
    name.textContent = song.title;
    info.appendChild(name);

    const sub = document.createElement("span");
    sub.className = "track-sub";
    sub.textContent = "Canción " + number(index + 1);
    info.appendChild(sub);

    const state = document.createElement("span");
    state.className = "track-icon";
    state.textContent = index === current && !audio.paused ? "♫" : "▶";

    button.append(num,info,state);
    button.addEventListener("click",() => {
      if (index === current) {
        togglePlay();
      } else {
        selectSong(index,true);
      }
    });
    container.appendChild(button);

    if (song.message) {
      const dedication = document.createElement("div");
      dedication.className = "dedication";

      if (song.date) {
        const date = document.createElement("small");
        date.textContent = song.date;
        dedication.appendChild(date);
      }

      const message = document.createElement("span");
      message.textContent = song.message;
      dedication.appendChild(message);
      container.appendChild(dedication);
    }

    playlist.appendChild(container);
  });
}

function updatePlayer() {
  const song = songs[current];
  songTitle.textContent = song.title;
  trackNumber.textContent =
    "Canción " + number(current + 1) +
    " de " + number(songs.length);

  const playing = !audio.paused && !audio.ended;
  playButton.textContent = playing ? "Ⅱ" : "▶";
  vinyl.classList.toggle("playing",playing);
  renderPlaylist();
}

function selectSong(index,autoplay=false) {
  current = index;
  audio.src = songs[current].file;
  audio.load();
  progress.value = 0;
  currentTime.textContent = "0:00";
  duration.textContent = "0:00";
  notice.textContent = "";
  updatePlayer();

  if (autoplay) {
    audio.play().catch(() => {
      notice.textContent =
        "No fue posible reproducir el archivo de esta canción.";
    });
  }
}

function togglePlay() {
  if (audio.paused) {
    audio.play().catch(() => {
      notice.textContent =
        "No fue posible reproducir el archivo de esta canción.";
    });
  } else {
    audio.pause();
  }
}

function nextSong() {
  if (shuffle && songs.length > 1) {
    let next;
    do {
      next = Math.floor(Math.random() * songs.length);
    } while (next === current);
    selectSong(next,true);
  } else {
    selectSong((current + 1) % songs.length,true);
  }
}

function previousSong() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  selectSong((current - 1 + songs.length) % songs.length,true);
}

playButton.addEventListener("click",togglePlay);
document.getElementById("next").addEventListener("click",nextSong);
document.getElementById("previous").addEventListener("click",previousSong);

shuffleButton.addEventListener("click",() => {
  shuffle = !shuffle;
  shuffleButton.classList.toggle("active",shuffle);
});

repeatButton.addEventListener("click",() => {
  repeat = !repeat;
  repeatButton.classList.toggle("active",repeat);
});

audio.addEventListener("play",updatePlayer);
audio.addEventListener("pause",updatePlayer);
audio.addEventListener("loadedmetadata",() => {
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate",() => {
  currentTime.textContent = formatTime(audio.currentTime);
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = Math.round(audio.currentTime / audio.duration * 1000);
  }
});

progress.addEventListener("input",() => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(progress.value) / 1000) * audio.duration;
  }
});

volume.addEventListener("input",() => {
  audio.volume = Number(volume.value);
});

audio.addEventListener("ended",() => {
  if (repeat) {
    audio.currentTime = 0;
    audio.play();
  } else {
    nextSong();
  }
});

audio.addEventListener("error",() => {
  if (audio.src) {
    notice.textContent =
      "No se encontró el audio. Revisa que el archivo MP3 esté en la carpeta audio.";
  }
});

audio.volume = .8;
selectSong(0,false);
</script>
</body>
</html>
