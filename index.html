<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0E0D;
    --ink:#0D1614;
    --teal-deep:#123A34;
    --teal:#3E8C7E;
    --blue-deep:#10233A;
    --blue:#3E6FA8;
    --text:#EAF2ED;
    --text-dim:#8FA79E;
    --line:rgba(234,242,237,0.09);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html, body{ overflow-x:hidden; }

  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(62,140,126,0.10), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(62,111,168,0.10), transparent 50%),
      var(--black);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:0 0 4rem;
  }

  .hero{
    max-width:640px;
    margin:0 auto;
    padding:clamp(2.4rem,8vw,4rem) 1.5rem 1.5rem;
    text-align:center;
  }

  .titulo{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.5rem, 6vw, 2.5rem);
    line-height:1.25;
  }

  .subtitulo{
    margin-top:0.8rem;
    font-size:clamp(0.85rem, 2.4vw, 0.92rem);
    color:var(--text-dim);
    line-height:1.6;
  }

  /* ---------- DISCO ---------- */
  .disco-zona{
    display:flex;
    justify-content:center;
    margin:clamp(1.6rem,6vw,2.5rem) 0 1rem;
  }

  .disco-marco{
    position:relative;
    width:clamp(190px, 55vw, 280px);
    height:clamp(190px, 55vw, 280px);
    transition: filter 0.6s ease;
  }

  .disco-marco.activo{
    filter: drop-shadow(0 0 24px rgba(62,140,126,0.35)) drop-shadow(0 0 44px rgba(62,111,168,0.18));
  }

  .anillo-progreso{
    position:absolute;
    inset:-10px;
    transform:rotate(-90deg);
  }

  .anillo-progreso circle{
    fill:none;
    stroke-width:2;
  }

  .anillo-fondo{ stroke: rgba(234,242,237,0.06); }
  .anillo-avance{
    stroke: url(#gradienteAnillo);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.2s linear;
  }

  .disco{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    overflow:hidden;
    background:#060908;
    box-shadow: 0 0 0 1px rgba(234,242,237,0.06), 0 20px 50px rgba(0,0,0,0.55);
    animation: girar 7s linear infinite;
    animation-play-state: paused;
  }

  .disco.girando{ animation-play-state: running; }

  .surcos{
    position:absolute;
    inset:0;
    border-radius:50%;
    pointer-events:none;
    background:
      repeating-radial-gradient(circle at center,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 5px,
        rgba(0,0,0,0.4) 6px, rgba(0,0,0,0) 7px),
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.05), transparent 45%);
  }

  .brillo{
    position:absolute;
    inset:-4%;
    border-radius:50%;
    pointer-events:none;
    background: conic-gradient(from 0deg,
      rgba(255,255,255,0) 0%, rgba(255,255,255,0.09) 6%, rgba(255,255,255,0) 14%,
      rgba(255,255,255,0) 48%, rgba(255,255,255,0.06) 54%, rgba(255,255,255,0) 62%,
      rgba(255,255,255,0) 100%);
    animation: girar-reversa 11s linear infinite;
    animation-play-state: paused;
  }

  .disco.girando .brillo{ animation-play-state: running; }

  .etiqueta{
    position:absolute;
    top:50%; left:50%;
    width:34%;
    height:34%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background: radial-gradient(circle at 32% 26%, var(--teal), var(--teal-deep) 40%, var(--blue-deep) 85%);
    box-shadow: 0 0 0 1px rgba(234,242,237,0.14), 0 4px 16px rgba(0,0,0,0.55), inset 0 0 14px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:2;
  }

  .etiqueta::after{
    content:"";
    width:12%;
    height:12%;
    min-width:8px;
    min-height:8px;
    border-radius:50%;
    background:var(--black);
    box-shadow: 0 0 0 1px rgba(234,242,237,0.15);
  }

  .brazo{
    position:absolute;
    top:-6px;
    right:2%;
    width:34%;
    height:34%;
    min-width:70px;
    min-height:70px;
    pointer-events:none;
    transform-origin: 88% 10%;
    transform: rotate(-28deg);
    transition: transform 0.5s ease;
  }

  .disco-marco.activo .brazo{ transform: rotate(0deg); }

  .brazo::before{
    content:"";
    position:absolute;
    top:8px; right:8px;
    width:4px;
    height:78%;
    border-radius:2px;
    background: linear-gradient(var(--text-dim), var(--teal));
  }

  .brazo::after{
    content:"";
    position:absolute;
    top:2px; right:1px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--ink);
    box-shadow: 0 0 0 1px rgba(234,242,237,0.15);
  }

  /* ---------- ECUALIZADOR REACTIVO ---------- */
  .ecualizador{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    height:22px;
    margin:1rem 0 0.4rem;
    opacity:0;
    transition: opacity 0.3s ease;
  }

  .ecualizador.activo{ opacity:1; }

  .ecualizador span{
    width:3px;
    height:3px;
    border-radius:2px;
    background: linear-gradient(var(--teal), var(--blue));
    transition: height 0.09s ease;
  }

  /* ---------- CONTROLES ---------- */
  .play-row{ display:flex; justify-content:center; margin:0.4rem 0 2.2rem; }

  .boton-play{
    display:flex;
    align-items:center;
    gap:0.55rem;
    background:transparent;
    border:1px solid var(--teal);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:0.82rem;
    letter-spacing:0.04em;
    padding:0.65rem 1.5rem;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .boton-play:hover{
    background: linear-gradient(90deg, var(--teal-deep), var(--blue-deep));
    border-color: var(--blue);
  }

  .boton-play svg{ width:13px; height:13px; }

  /* ---------- TRACKLIST & TARJETAS DE ANIVERSARIO ---------- */
  .album{
    max-width:520px;
    margin:0 auto;
    padding:0 1.2rem;
  }

  .pista-contenedor{
    margin-bottom:0.6rem;
  }

  .pista{
    display:flex;
    align-items:center;
    gap:1rem;
    padding:0.85rem 0.5rem;
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .pista:hover{ background: rgba(234,242,237,0.03); }

  .pista.activa{
    background: linear-gradient(90deg, rgba(18,58,52,0.4), rgba(16,35,58,0.4));
    border-color: var(--line);
  }

  .pista-numero{
    font-family:'Newsreader', serif;
    font-style:italic;
    color:var(--teal);
    font-size:0.95rem;
    width:1.6rem;
    flex-shrink:0;
    text-align:center;
  }

  .pista-nombre{
    flex:1;
    font-size:0.92rem;
    min-width:0;
  }

  .pista-estado{
    width:16px;
    height:16px;
    color:var(--text-dim);
    flex-shrink:0;
  }

  .pista.activa .pista-estado{ color:var(--teal); }

  /* --- Resaltado Especial Aniversario para Casillas 3 y 4 --- */
  .pista-especial {
    border: 1px solid rgba(62, 140, 126, 0.4) !important;
    background: linear-gradient(135deg, rgba(18, 58, 52, 0.35), rgba(16, 35, 58, 0.45), rgba(40, 20, 50, 0.3)) !important;
    box-shadow: 0 4px 20px rgba(62, 140, 126, 0.15);
    position: relative;
    overflow: hidden;
  }

  .pista-especial::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
    animation: resplandorPista 4s infinite linear;
    pointer-events: none;
  }

  @keyframes resplandorPista {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Estilos para las notas especiales con animación de color */
  .nota-destacada {
    margin: 0.2rem 0.3rem 0.6rem 2.2rem;
    padding: 0.65rem 0.95rem;
    border-radius: 8px;
    background: rgba(10, 14, 13, 0.6);
    border: 1px solid rgba(234, 242, 237, 0.08);
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    backdrop-filter: blur(4px);
  }

  .nota-fecha {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal);
    opacity: 0.9;
  }

  .nota-texto {
    font-size: 0.88rem;
    font-weight: 500;
    font-family: 'Newsreader', serif;
    font-style: italic;
    line-height: 1.4;
    
    /* Animación continua de color */
    animation: cambioColor 6s infinite alternate ease-in-out;
  }

  @keyframes cambioColor {
    0% {
      color: #3E8C7E;
    }
    33% {
      color: #5B9BD5;
    }
    66% {
      color: #E2A0B7;
    }
    100% {
      color: #E6C875;
    }
  }

  .aviso{
    max-width:480px;
    margin:2.5rem auto 0;
    padding:0 1.5rem;
    text-align:center;
    font-size:0.78rem;
    color:var(--text-dim);
    line-height:1.6;
  }

  @keyframes girar{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @keyframes girar-reversa{ from{transform:rotate(360deg);} to{transform:rotate(0deg);} }
</style>
</head>
<body>

<div class="hero">
  <h1 class="titulo">Canciones que me hacen pensar en ti</h1>
  <p class="subtitulo">Aquí voy a ir guardando las canciones que me recuerdan a ti.</p>
</div>

<div class="disco-zona">
  <div class="disco-marco" id="disco-marco">
    <svg class="anillo-progreso" viewBox="0 0 300 300">
      <defs>
        <linearGradient id="gradienteAnillo" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3E8C7E"/>
          <stop offset="100%" stop-color="#3E6FA8"/>
        </linearGradient>
      </defs>
      <circle class="anillo-fondo" cx="150" cy="150" r="147"/>
      <circle class="anillo-avance" id="anillo-avance" cx="150" cy="150" r="147"/>
    </svg>
    <div class="brazo"></div>
    <div class="disco" id="disco">
      <div class="surcos"></div>
      <div class="brillo"></div>
      <div class="etiqueta"></div>
    </div>
  </div>
</div>

<div class="ecualizador" id="ecualizador">
  <span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span>
</div>

<div class="play-row">
  <button class="boton-play" id="boton-principal">
    <svg id="icono-principal" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <span id="texto-principal">Reproducir</span>
  </button>
</div>

<div class="album" id="lista-pistas"></div>

<p class="aviso" id="aviso"></p>

<audio id="reproductor" preload="metadata"></audio>

<script>
  /* ============================================================
     LISTADO DE CANCIONES Y NOTAS DE ANIVERSARIO
     ============================================================ */

  const canciones = [
    { 
      archivo: "audio/cancion-01.mp3", 
      titulo: "Beso" 
    },
    { 
      archivo: "audio/cancion-02.mp3", 
      titulo: "Donde Nadie Pueda Ir" 
    },
    { 
      archivo: "audio/cancion-03.mp3", 
      titulo: "Feliz me Siento", 
      resaltada: true,
      fecha: "19/08/2026",
      nota: "Feliz primer año de muchos amor mío" 
    },
    { 
      archivo: "audio/cancion-04.mp3", 
      titulo: "Eres ese Algo", 
      resaltada: true,
      fecha: "19/08/2026",
      nota: "El día en que nuestras vidas se cruzaron para siempre ❤️" 
    }
  ];

  const listaEl = document.getElementById("lista-pistas");
  const disco = document.getElementById("disco");
  const discoMarco = document.getElementById("disco-marco");
  const botonPrincipal = document.getElementById("boton-principal");
  const iconoPrincipal = document.getElementById("icono-principal");
  const textoPrincipal = document.getElementById("texto-principal");
  const ecualizador = document.getElementById("ecualizador");
  const barras = ecualizador.querySelectorAll("span");
  const audio = document.getElementById("reproductor");
  const aviso = document.getElementById("aviso");
  const anilloAvance = document.getElementById("anillo-avance");

  const ICONO_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICONO_PAUSA = '<path d="M9 6h2v12H9zM13 6h2v12h-2z"/>';

  const RADIO = 147;
  const PERIMETRO = 2 * Math.PI * RADIO;
  anilloAvance.style.strokeDasharray = PERIMETRO;
  anilloAvance.style.strokeDashoffset = PERIMETRO;

  let indiceActual = 0;
  let sonando = false;
  let animacionId = null;

  function iconoEstado(activa){
    return activa
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + ICONO_PAUSA + '</svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor">' + ICONO_PLAY + '</svg>';
  }

  function pintarLista(){
    listaEl.innerHTML = "";
    canciones.forEach(function(cancion, i){
      const enEsta = i === indiceActual;
      
      const contenedor = document.createElement("div");
      contenedor.className = "pista-contenedor";

      const fila = document.createElement("div");
      fila.className = "pista" + (enEsta ? " activa" : "") + (cancion.resaltada ? " pista-especial" : "");
      
      const numero = String(i + 1).padStart(2, "0");
      fila.innerHTML =
        '<span class="pista-numero">' + numero + '</span>' +
        '<span class="pista-nombre">' + cancion.titulo + '</span>' +
        '<span class="pista-estado">' + iconoEstado(enEsta && sonando) + '</span>';
      
      fila.addEventListener("click", function(){
        if(i === indiceActual){
          alternarReproduccion();
        } else {
          indiceActual = i;
          cargarCancion(true);
        }
      });

      contenedor.appendChild(fila);

      // Si la canción incluye nota y fecha, se renderiza la tarjeta resaltada
      if(cancion.nota){
        const notaEl = document.createElement("div");
        notaEl.className = "nota-destacada";
        
        let htmlNota = "";
        if(cancion.fecha){
          htmlNota += '<span class="nota-fecha">✦ ' + cancion.fecha + '</span>';
        }
        htmlNota += '<span class="nota-texto">' + cancion.nota + '</span>';
        
        notaEl.innerHTML = htmlNota;
        contenedor.appendChild(notaEl);
      }

      listaEl.appendChild(contenedor);
    });
  }

  function animarEcualizador(){
    const t = Date.now() / 160;
    barras.forEach(function(barra, i){
      const altura = 3 + (Math.sin(t + i * 0.9) + 1) * 9;
      barra.style.height = altura + "px";
    });
    if(sonando){
      animacionId = requestAnimationFrame(animarEcualizador);
    } else {
      animacionId = null;
    }
  }

  function actualizarAnillo(){
    if(audio.duration){
      const avance = audio.currentTime / audio.duration;
      anilloAvance.style.strokeDashoffset = PERIMETRO * (1 - avance);
    }
  }

  function actualizarUI(){
    iconoPrincipal.innerHTML = sonando ? ICONO_PAUSA : ICONO_PLAY;
    textoPrincipal.textContent = sonando ? "Pausar" : "Reproducir";
    disco.classList.toggle("girando", sonando);
    discoMarco.classList.toggle("activo", sonando);
    ecualizador.classList.toggle("activo", sonando);
    pintarLista();
  }

  function cargarCancion(autoreproducir){
    audio.src = canciones[indiceActual].archivo;
    anilloAvance.style.strokeDashoffset = PERIMETRO;
    if(autoreproducir){
      audio.play().catch(function(){ mostrarAviso(); });
    }
  }

  function mostrarAviso(){
    aviso.textContent = "Copia tus archivos mp3 en la carpeta \"audio\" (cancion-01.mp3 a cancion-04.mp3) para reproducir la música.";
  }

  function alternarReproduccion(){
    if(!audio.src){
      cargarCancion(true);
      return;
    }
    if(audio.paused){
      audio.play().catch(function(){ mostrarAviso(); });
    } else {
      audio.pause();
    }
  }

  audio.addEventListener("play", function(){
    sonando = true;
    actualizarUI();
    if(!animacionId) animarEcualizador();
  });

  audio.addEventListener("pause", function(){
    sonando = false;
    actualizarUI();
  });

  audio.addEventListener("ended", function(){
    indiceActual = (indiceActual + 1) % canciones.length;
    cargarCancion(true);
  });

  audio.addEventListener("timeupdate", actualizarAnillo);

  audio.addEventListener("error", function(){
    sonando = false;
    actualizarUI();
    mostrarAviso();
  });

  botonPrincipal.addEventListener("click", alternarReproduccion);
  pintarLista();
</script>

</body>
</html>
