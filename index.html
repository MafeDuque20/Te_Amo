<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para mi chama hermosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0c0a0e;
    --charcoal:#18151b;
    --ash:#2b2630;
    --pink:#f4a6c6;
    --pink-deep:#e0729e;
    --cream:#f5eef1;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(224,114,158,0.16), transparent 55%),
      radial-gradient(ellipse at 85% 80%, rgba(244,166,198,0.10), transparent 50%),
      linear-gradient(180deg, var(--black) 0%, var(--charcoal) 55%, #14111a 100%);
    overflow:hidden;
    font-family:'Quicksand', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  .hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
  }

  .heart{
    position:absolute;
    bottom:-10%;
    color:var(--pink);
    opacity:0;
    filter:drop-shadow(0 0 6px rgba(244,166,198,0.35));
    animation: rise linear infinite;
  }

  @keyframes rise{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.55; }
    50%{ transform: translateY(-55vh) translateX(var(--drift,10px)) rotate(15deg); }
    90%{ opacity:0.35; }
    100%{ transform: translateY(-105vh) translateX(calc(var(--drift,10px) * -1)) rotate(-10deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    min-height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw 6vh;
    text-align:center;
  }

  .phrase-box{
    position:relative;
    width:min(720px, 88vw);
    min-height:clamp(180px, 32vh, 300px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .phrase{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-style:italic;
    color:var(--cream);
    font-size:clamp(1.5rem, 4.6vw, 2.7rem);
    line-height:1.35;
    letter-spacing:0.01em;
    opacity:0;
    filter:blur(6px);
    transform:scale(0.96);
    text-shadow: 0 0 24px rgba(224,114,158,0.25);
  }

  .phrase.final{
    color:var(--pink);
  }

  .phrase.show{
    animation: reveal 3.6s ease forwards;
  }

  .phrase.stay{
    animation: settle 1.6s ease forwards;
  }

  @keyframes reveal{
    0%{ opacity:0; filter:blur(6px); transform:scale(0.96); }
    18%{ opacity:1; filter:blur(0); transform:scale(1); }
    78%{ opacity:1; filter:blur(0); transform:scale(1); }
    100%{ opacity:0; filter:blur(6px); transform:scale(1.03); }
  }

  @keyframes settle{
    0%{ opacity:0; filter:blur(6px); transform:scale(0.96); }
    100%{ opacity:1; filter:blur(0); transform:scale(1); }
  }

  .divider{
    width:64px;
    height:1px;
    margin: 1.6rem auto 0;
    background:linear-gradient(90deg, transparent, var(--pink-deep), transparent);
    opacity:0;
    transition:opacity 1.2s ease;
  }

  .divider.show{ opacity:0.7; }

  .cta{
    margin-top:2.4rem;
    opacity:0;
    transform:translateY(14px);
    transition: opacity 1s ease, transform 1s ease;
    pointer-events:none;
  }

  .cta.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .cta a{
    display:inline-flex;
    align-items:center;
    gap:0.55rem;
    text-decoration:none;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:clamp(0.95rem, 2.6vw, 1.08rem);
    color:var(--black);
    background:linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    padding:0.95rem 1.9rem;
    border-radius:999px;
    box-shadow:0 8px 28px rgba(224,114,158,0.35), 0 0 0 1px rgba(255,255,255,0.06) inset;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    letter-spacing:0.01em;
  }

  .cta a:hover, .cta a:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 12px 34px rgba(224,114,158,0.5), 0 0 0 1px rgba(255,255,255,0.08) inset;
  }

  .cta a:active{
    transform:translateY(0px) scale(0.98);
  }

  .cta svg{ width:20px; height:20px; flex-shrink:0; }

  .footnote{
    margin-top:1.3rem;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(0.85rem, 2.4vw, 1rem);
    color:var(--pink);
    opacity:0;
    transform:translateY(10px);
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .footnote.show{
    opacity:0.85;
    transform:translateY(0);
  }

  .signature{
    position:relative;
    z-index:2;
    padding-bottom:3vh;
    text-align:center;
    font-family:'Quicksand', sans-serif;
    font-size:0.78rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ash);
    opacity:0.75;
  }

  .signature span{
    color:var(--pink-deep);
  }

  @media (prefers-reduced-motion: reduce){
    .heart{ animation:none; opacity:0.25; }
    .phrase.show, .phrase.stay{ animation:none; opacity:1; filter:none; transform:none; }
    .divider, .cta{ transition:none; }
  }
</style>
</head>
<body>

  <div class="hearts" id="hearts"></div>

  <main class="stage">
    <div class="phrase-box">
      <p class="phrase" id="p1">Siempre serás mi mujer Irreal,</p>
      <p class="phrase" id="p2">por más cosas que pasemos,</p>
      <p class="phrase final" id="p3">siempre, siempre, mi chama hermosa.</p>
    </div>

    <div class="divider" id="divider"></div>

    <div class="cta" id="cta">
      <a id="waLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 10.5c0-3.31 2.69-6 6-6s6 2.69 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M4.5 10.5h15a.6.6 0 0 1 .6.72l-.4 1.9a.9.9 0 0 1-.88.7H5.18a.9.9 0 0 1-.88-.7l-.4-1.9a.6.6 0 0 1 .6-.72Z" fill="currentColor" opacity="0.9"/>
          <rect x="10.6" y="7.4" width="2.8" height="1.5" rx="0.3" fill="var(--charcoal)" opacity="0.55"/>
          <circle cx="12" cy="16.3" r="2.6" fill="currentColor" opacity="0.16" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8.7 21.2c0-1.9 1.5-3.3 3.3-3.3s3.3 1.4 3.3 3.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Dele acá Mami
      </a>
    </div>

    <p class="footnote" id="footnote">siempre mi corazón será tuyo</p>
  </main>

  <p class="signature">para mi chama hermosa <span>&#9825;</span></p>

<script>
  // Botón de WhatsApp: número + mensaje precargado
  const phone = "573206401430";
  const message = "Me caeS mal pero te AMO AMO AMO ";
  document.getElementById("waLink").href =
    "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

  // Corazones flotando de fondo
  const heartsContainer = document.getElementById("hearts");
  const HEART_COUNT = 18;
  for (let i = 0; i < HEART_COUNT; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = Math.random() > 0.5 ? "&#10084;" : "&#9825;";
    const size = 10 + Math.random() * 18;
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = size + "px";
    h.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
    const duration = 9 + Math.random() * 10;
    h.style.animationDuration = duration + "s";
    h.style.animationDelay = (Math.random() * duration) + "s";
    heartsContainer.appendChild(h);
  }

  // Secuencia de frases
  const p1 = document.getElementById("p1");
  const p2 = document.getElementById("p2");
  const p3 = document.getElementById("p3");
  const divider = document.getElementById("divider");
  const cta = document.getElementById("cta");
  const footnote = document.getElementById("footnote");

  function run(){
    p1.classList.add("show");
    setTimeout(() => p2.classList.add("show"), 3100);
    setTimeout(() => {
      p3.classList.add("stay");
      divider.classList.add("show");
      cta.classList.add("show");
      setTimeout(() => footnote.classList.add("show"), 500);
    }, 6200);
  }

  window.addEventListener("load", () => setTimeout(run, 300));
</script>

</body>
</html>
